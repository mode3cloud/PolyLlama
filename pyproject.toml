[project]
name = "polyllama"
version = "0.1.0"
description = "Dynamic multi-instance Ollama orchestration system with automatic GPU detection and intelligent load balancing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Testing dependencies
    "pytest>=8.4.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.0.0",
    # Core dependencies
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    # LLM Proxy dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "litellm==1.61.15",
    "httpx>=0.27.0",
    "python-multipart==0.0.18",
    "neo4j==5.14.0",
    "mcp>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["*"]
python_files = ["*.py"]
python_classes = ["*"]
addopts = "--cov=builder --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["builder", "main.py"]
omit = ["tests/*", "*/venv/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
[tool.pylint.messages_control]
disable = [
    "W0611",
    "W0718",
    "W1203",
    "W0702",
    "C0301",
    "W0719",
    "C0415",
    "C0209",
]
