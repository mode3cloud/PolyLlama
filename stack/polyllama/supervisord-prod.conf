[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=sh -c "mkdir -p /var/log/nginx && /usr/local/openresty/bin/openresty -g 'daemon off;'"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
priority=10

[program:nextjs]
command=pnpm start
directory=/app
autostart=true
autorestart=true
environment=NODE_ENV="production",PORT="3000",NEXT_TELEMETRY_DISABLED="1",JWT_SECRET="%(ENV_JWT_SECRET)s",AZURE_AD_CLIENT_ID="%(ENV_AZURE_AD_CLIENT_ID)s",AZURE_AD_TENANT_ID="%(ENV_AZURE_AD_TENANT_ID)s",AZURE_AD_CLIENT_SECRET="%(ENV_AZURE_AD_CLIENT_SECRET)s",AZURE_AD_ALLOWED_USERS="%(ENV_AZURE_AD_ALLOWED_USERS)s",AZURE_AD_ALLOWED_DOMAINS="%(ENV_AZURE_AD_ALLOWED_DOMAINS)s",POLYLLAMA_API_KEY="%(ENV_POLYLLAMA_API_KEY)s",SKIP_AUTH="%(ENV_SKIP_AUTH)s"
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20